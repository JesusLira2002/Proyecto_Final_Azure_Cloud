<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Local Azure CRUD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow p-4" style="max-width: 500px; margin: auto;">
            <h2 class="text-center mb-4">Registro de Usuario</h2>
            
            <form id="miFormulario">
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre:</label>
                    <input type="text" class="form-control" id="nombre" required>
                </div>
                <div class="mb-3">
                    <label for="email" class="form-label">Email:</label>
                    <input type="email" class="form-control" id="email" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Enviar a Azure</button>
            </form>
            
            <div id="mensaje" class="mt-3 text-center fw-bold"></div>
        </div>
    </div>

    <script>
        document.getElementById('miFormulario').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nombre = document.getElementById('nombre').value;
            const email = document.getElementById('email').value;
            const mensajeDiv = document.getElementById('mensaje');

            // URL de la función Azure Backend
            const functionUrl = 'https://backend-jesus-virginia-dcahfeb3cjd0fch3.northcentralus-01.azurewebsites.net/api/crearusuario';

            mensajeDiv.innerHTML = '<span class="text-secondary">Enviando datos...</span>';

            try {
                const response = await fetch(functionUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nombre: nombre, email: email })
                });

                if (response.ok) {
                    // Si el backend responde bien, mostramos este mensaje
                    const texto = await response.text();
                    mensajeDiv.innerHTML = `<span class="text-success">${texto}</span>`;
                } else {
                    mensajeDiv.innerHTML = '<span class="text-danger">Error del servidor.</span>';
                }
            } catch (error) {
                console.error(error);
                mensajeDiv.innerHTML = '<span class="text-danger">No se pudo conectar. </span>';
            }
        });
    </script>
</body>
</html>
